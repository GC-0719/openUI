name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Lint is informational while legacy findings are being cleaned up.
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build (React studio)
        run: npm run build:react
      - name: Build (@openui/react package)
        run: npm run build --prefix kits/react/template
      - name: Build (@openui/angular package)
        run: npm run build --prefix kits/angular/template
