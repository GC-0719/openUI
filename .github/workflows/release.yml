name: Release @openui/react

# Publishes the bundled kit package when a version tag is pushed.
# Requires an NPM_TOKEN repository secret (and the @openui npm org to exist).
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Publish @openui/react
        working-directory: kits/react/template
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Build @openui/angular
        run: npm run build --prefix kits/angular/template
      - name: Publish @openui/angular
        run: npm publish kits/angular/template/dist --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
