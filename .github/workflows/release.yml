name: Release @openedui packages

# Publishes the kit packages to npm WITH PROVENANCE when a version tag (v*) is
# pushed. Provenance adds a verified "Built and signed on GitHub Actions" badge
# on npm that links each package back to this repo + commit.
#
# Requires an NPM_TOKEN repo secret = a granular token with read-write on the
# @openedui scope and "bypass 2FA for publish" enabled.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Publish @openedui/react
        working-directory: kits/react/template
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Build @openedui/angular
        run: npm run build --prefix kits/angular/template
      - name: Publish @openedui/angular
        run: npm publish kits/angular/template/dist --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
