<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="openUI — a local-first AI sandbox for building production-ready frontends">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0a0a0a" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="318" width="1200" height="2" fill="#0a0a0a" fill-opacity="0.06"/>

  <!-- Brand row -->
  <g transform="translate(80 62)">
    <g transform="scale(1.75)">
      <rect width="32" height="32" rx="9" fill="#0a0a0a"/>
      <rect x="6.5" y="9.5" width="19" height="13.5" rx="3.2" fill="#ffffff"/>
      <rect x="6.5" y="9.5" width="6.6" height="13.5" rx="3.2" fill="#0a0a0a" fill-opacity="0.08"/>
      <circle cx="9.8" cy="13.2" r="1.05" fill="#0a0a0a" fill-opacity="0.35"/>
      <rect x="15.4" y="13.4" width="7.6" height="1.9" rx="0.95" fill="#0a0a0a" fill-opacity="0.25"/>
      <rect x="15.4" y="17.6" width="5" height="1.9" rx="0.95" fill="#0a0a0a" fill-opacity="0.15"/>
      <path d="M24.3 3.4l.97 2.33 2.33.97-2.33.97-.97 2.33-.97-2.33L20.03 6.7l2.33-.97z" fill="#0a0a0a"/>
    </g>
    <text x="72" y="40" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" letter-spacing="-0.5">
      <tspan font-weight="500" fill="#525252">open</tspan><tspan font-weight="800" fill="#0a0a0a">UI</tspan>
    </text>
    <rect x="196" y="14" width="118" height="28" rx="14" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <text x="255" y="33" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#525252" text-anchor="middle">MIT · v0.2.0</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80 150)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="0" y="34" font-size="46" font-weight="800" fill="#0a0a0a" letter-spacing="-1.2">Build full frontends with AI —</text>
    <text x="0" y="92" font-size="46" font-weight="800" fill="#525252" letter-spacing="-1.2">wired to your real backend.</text>
  </g>

  <!-- Feature chips -->
  <g transform="translate(82 286)" font-family="system-ui, sans-serif" font-size="13" font-weight="600">
    <g>
      <rect x="0" y="-20" width="118" height="28" rx="14" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
      <text x="59" y="-1" fill="#525252" text-anchor="middle">Sandbox IDE</text>
