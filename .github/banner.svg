    <rect x="16" y="58" width="48" height="6" rx="3" fill="#0a0a0a" fill-opacity="0.08"/>
    <rect x="16" y="74" width="40" height="6" rx="3" fill="#0a0a0a" fill-opacity="0.08"/>
    <rect x="16" y="90" width="46" height="6" rx="3" fill="#0a0a0a"/>
    <rect x="104" y="22" width="120" height="68" rx="8" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="116" y="36" width="58" height="8" rx="4" fill="#0a0a0a" fill-opacity="0.15"/>
    <rect x="116" y="56" width="74" height="20" rx="6" fill="#0a0a0a"/>
    <rect x="116" y="104" width="14" height="22" rx="3" fill="#0a0a0a" fill-opacity="0.2"/>
    <rect x="136" y="98" width="14" height="28" rx="3" fill="#0a0a0a" fill-opacity="0.35"/>
    <rect x="156" y="110" width="14" height="16" rx="3" fill="#0a0a0a" fill-opacity="0.15"/>
    <rect x="176" y="92" width="14" height="34" rx="3" fill="#0a0a0a" fill-opacity="0.5"/>
    <rect x="104" y="140" width="170" height="24" rx="8" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <circle cx="118" cy="152" r="4" fill="#0a0a0a"/>
    <rect x="130" y="148" width="120" height="8" rx="4" fill="#0a0a0a" fill-opacity="0.2"/>
  </g>
