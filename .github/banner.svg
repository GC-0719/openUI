<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="openUI — a local-first AI sandbox for building production-ready frontends">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c0c11"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(600 -40) rotate(90) scale(360 1100)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="120" y1="150" x2="640" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8"/>
      <stop offset="0.6" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- Brand row -->
  <g transform="translate(80 64)">
    <rect width="56" height="56" rx="15" fill="url(#logo)"/>
    <text x="28" y="40" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle">◍</text>
    <text x="76" y="40" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="800" fill="#f8f8f8" letter-spacing="-0.5">openUI</text>
    <rect x="240" y="14" width="118" height="28" rx="14" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.3"/>
    <text x="299" y="33" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc" text-anchor="middle">MIT · v0.1.0</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80 150)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="0" y="34" font-size="46" font-weight="800" fill="#f8f8f8" letter-spacing="-1.2">Build full frontends with AI —</text>
    <text x="0" y="92" font-size="46" font-weight="800" fill="url(#accent)" letter-spacing="-1.2">wired to your real backend.</text>
  </g>

  <!-- Feature chips -->
  <g transform="translate(82 286)" font-family="system-ui, sans-serif" font-size="13" font-weight="600">
    <g>
      <rect x="0" y="-20" width="118" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="59" y="-1" fill="#cbd0db" text-anchor="middle">Sandbox IDE</text>
    </g>
    <g transform="translate(130 0)">
      <rect x="0" y="-20" width="128" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="64" y="-1" fill="#cbd0db" text-anchor="middle">AI full-build</text>
    </g>
    <g transform="translate(270 0)">
      <rect x="0" y="-20" width="146" height="28" rx="14" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="73" y="-1" fill="#34d399" text-anchor="middle">MCP backend</text>
    </g>
    <g transform="translate(428 0)">
      <rect x="0" y="-20" width="168" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="84" y="-1" fill="#cbd0db" text-anchor="middle">Export · npm · zip</text>
    </g>
  </g>

  <!-- Studio glyph (right) -->
  <g transform="translate(830 70)" opacity="0.95">
    <rect width="290" height="180" rx="14" fill="#0d0d12" stroke="#ffffff" stroke-opacity="0.1"/>
    <!-- sidebar -->
    <rect width="84" height="180" rx="14" fill="#0a0a0e"/>
    <rect x="84" width="1" height="180" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="16" y="22" width="52" height="7" rx="3.5" fill="#6366F1" fill-opacity="0.5"/>
    <rect x="16" y="42" width="44" height="6" rx="3" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="16" y="58" width="48" height="6" rx="3" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="16" y="74" width="40" height="6" rx="3" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="16" y="90" width="46" height="6" rx="3" fill="#ffffff" fill-opacity="0.14"/>
    <!-- main: card + button -->
    <rect x="104" y="22" width="120" height="68" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="116" y="36" width="58" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="116" y="56" width="74" height="20" rx="6" fill="#6366F1"/>
    <!-- bars -->
    <rect x="116" y="104" width="14" height="22" rx="3" fill="#6366F1" fill-opacity="0.5"/>
    <rect x="136" y="98" width="14" height="28" rx="3" fill="#6366F1" fill-opacity="0.7"/>
    <rect x="156" y="110" width="14" height="16" rx="3" fill="#6366F1" fill-opacity="0.4"/>
    <rect x="176" y="92" width="14" height="34" rx="3" fill="#6366F1" fill-opacity="0.85"/>
    <!-- agent ping -->
    <rect x="104" y="140" width="170" height="24" rx="8" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.25"/>
    <circle cx="118" cy="152" r="4" fill="#34d399"/>
    <rect x="130" y="148" width="120" height="8" rx="4" fill="#34d399" fill-opacity="0.5"/>
  </g>
</svg>
